<html>
<head>
<title>My Webpage</title>
<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#eaf6ff;
    font-family:Arial;
}
.box{
    width:480px;
    padding:45px;
    text-align:center;
    background:white;
    border-radius:20px;
    box-shadow:0 5px 20px #aaa;
}
h1{
    color:#1976d2;
    font-size:32px;
}
h3{
    color:#333;
}
h4{
    color:#555;
    font-size:17px;
}
p{
    color:#e06b8b;
    font-weight:bold;
}
button{
    padding:11px 30px;
    border:0;
    border-radius:20px;
    background:#1976d2;
    color:white;
    cursor:pointer;
}
button:hover{
    background:#0d47a1;
}
</style>
</head>

<body>

<div class="box">
    <h1> Welcome </h1>
    <h3>Name: Vaishali Patil</h3>
    <h4>College Name: Government Polytechnic Pen</h4>
    <p>Department: Computer Technology</p>
    <button>Click Me</button>
</div>

</body>
</html>
